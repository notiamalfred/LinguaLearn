<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'" />
  <title>Choose a new password — LinguaLearn</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="flashcards.css" />
</head>
<body class="fc-scope">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Lingua<span>Learn</span></a>
      <button class="menu-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listening.html">Listening</a>
        <a href="speaking.html">Speaking</a>
        <a href="reading.html">Reading</a>
        <a href="writing.html">Writing</a>
        <a href="vocabulary.html">Vocabulary</a>
        <a href="flashcards.html">Daily Review</a>
        <a href="inspirational.html">Inspirational Words</a>
        <a href="recommendation.html">Recommendations</a>
        <a href="https://notiamalfred.github.io/EconLearn" class="cross-link">EconLearn ↗</a>
        <a href="https://notiamalfred.github.io/MathLearn/" class="cross-link">MathLearn ↗</a>
      </nav>
    </div>
  </header>

  <section class="skill-page">
    <div class="container">
      <div class="fc-auth">
        <h2>Choose a new password</h2>

        <form id="reset-form" novalidate hidden>
          <div class="fc-field">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" autocomplete="new-password" maxlength="72" required />
            <p class="fc-hint">At least 12 characters.</p>
          </div>
          <div class="fc-field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" autocomplete="new-password" maxlength="72" required />
            <label class="fc-check"><input type="checkbox" id="show-passwords" /> Show passwords</label>
          </div>
          <button type="submit" class="fc-btn fc-btn--next fc-btn--block" id="reset-submit">Save new password</button>
        </form>

        <p id="reset-message" class="fc-message" role="alert"></p>
        <p class="fc-switch"><a class="fc-linkbtn" href="login.html">Back to sign in</a></p>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>Keep learning, keep growing.</p>
    </div>
  </footer>
  <script 
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"
    integrity="sha384-tuevtT+97g9yLeuT/m52ejUJbc0hzsN6MPLiQEccySreiGjrcgk2tMBJR7/l6HGM"
    crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="menu.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
