<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspirational Words — LinguaLearn</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Lingua<span>Learn</span></a>

      <div class="skill-search" role="search">
        <div class="skill-search__field">
          <svg class="skill-search__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>

          <label class="visually-hidden" for="skillSearch">Search skills</label>
          <input
            id="skillSearch"
            type="search"
            placeholder="Search skills…  (press / )"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="skillSearchStatus"
          >

          <button
            id="skillSearchClear"
            class="skill-search__clear"
            type="button"
            hidden
            aria-label="Clear search"
          >&times;</button>

          <div id="searchResults" class="search-results" hidden></div>
        </div>

        <p id="skillSearchStatus" class="skill-search__status" role="status" aria-live="polite"></p>
      </div>

      <button class="menu-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="listening.html">Listening</a>
        <a href="speaking.html">Speaking</a>
        <a href="reading.html">Reading</a>
        <a href="writing.html">Writing</a>
        <a href="vocabulary.html">Vocabulary</a>
        <a href="inspirational.html">Inspirational Words</a>
        <a href="recommendation.html">Recommendations</a>
        <a href="https://notiamalfred.github.io/EconLearn" class="cross-link">EconLearn ↗</a>
      </nav>
    </div>
  </header>

  <section class="inspirational">
    <div class="container">
      <h2>Inspirational Words</h2>
      <p class="section-subtitle">
        Short passages to inspire your day — and your English.
      </p>
      <div id="passages" class="passage-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>Keep learning, keep growing.</p>
    </div>
  </footer>

  <script src="passages.js"></script>
  <script src="app.js"></script>
  <script src="menu.js"></script>
  <script src="site-search.js"></script>
</body>
</html>
